allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
buildscript {
    repositories {
        google()  // Make sure this is included
        mavenCentral()  // Optional, but often used
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.1'  // Use the version that matches your Android Gradle Plugin
        classpath 'com.google.gms:google-services:4.3.15' // Ensure this is the correct version
    }
}

allprojects {
    repositories {
        google()  // Make sure this is included
        mavenCentral()  // Optional, but often used
    }
}
